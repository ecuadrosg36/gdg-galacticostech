<div class="app-shell">

    <div class="brand">
      <div class="avatar">🤖</div>
      <h1>Gemma</h1>
    </div>
    <div class="offline-badge">
      <span class="dot"></span>
      Modo Offline Activo
    </div>
  </header>

  <router-outlet />

  <nav class="bottom-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
      <span>🏠</span>Inicio
    </a>
    <a routerLink="/materias" routerLinkActive="active" class="nav-item">
      <span>📚</span>Materias
    </a>
    <a routerLink="/progreso" routerLinkActive="active" class="nav-item">
      <span>📈</span>Progreso
    </a>
    <a routerLink="/ayuda" routerLinkActive="active" class="nav-item">
      <span>❓</span>Ayuda
    </a>
  </nav>
</div>
